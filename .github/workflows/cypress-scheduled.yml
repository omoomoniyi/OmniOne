name: Scheduled Cypress Tests

on:
  schedule:
    # WAT (UTC+1): 6:00 AM, 12:00 PM, 8:00 PM
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL || 'https://mos-dev-tau.vercel.app/' }}
      SSO_URL: ${{ secrets.SSO_URL || vars.SSO_URL || 'https://sso-dev.vercel.app' }}
      CYPRESS_baseUrl: ${{ secrets.BASE_URL || vars.BASE_URL || 'https://mos-dev-tau.vercel.app/' }}
      CYPRESS_SSO_URL: ${{ secrets.SSO_URL || vars.SSO_URL || 'https://sso-dev.vercel.app' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment variables
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::BASE_URL is not set. Add it under Settings → Secrets and variables → Actions (Secrets or Variables tab). Name must be exactly BASE_URL and include https://"
            exit 1
          fi
          if [ -z "$SSO_URL" ]; then
            echo "::error::SSO_URL is not set. Add it under Settings → Secrets and variables → Actions (Secrets or Variables tab). Name must be exactly SSO_URL and include https://"
            exit 1
          fi
          case "$BASE_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::BASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac
          echo "BASE_URL and SSO_URL are configured."
          if [ "${{ secrets.BASE_URL }}" = "" ] && [ "${{ vars.BASE_URL }}" = "" ]; then
            echo "::warning::Using default staging BASE_URL. Add a BASE_URL secret to override."
          fi
          if [ "${{ secrets.SSO_URL }}" = "" ] && [ "${{ vars.SSO_URL }}" = "" ]; then
            echo "::warning::Using default staging SSO_URL. Add a SSO_URL secret to override."
          fi

      - name: Run Cypress tests
        id: cypress
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:ci

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Send email report
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Cypress Report - ${{ job.status }} - Run #${{ github.run_number }}
          to: omoniyi.osadare@mplify.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Cypress automation finished.

            Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download screenshots and videos from the GitHub Actions run artifacts.
          secure: true
