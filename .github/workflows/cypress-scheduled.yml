name: Scheduled Cypress Tests

on:
  schedule:
    # WAT (UTC+1): 6:00 AM, 12:00 PM, 8:00 PM
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        id: cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          command: npm run test:ci
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SSO_URL: ${{ secrets.SSO_URL }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Cypress Report - ${{ job.status }} - Run #${{ github.run_number }}
          to: omoniyi.osadare@mplify.com
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Cypress automation finished.

            Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download screenshots and videos from the GitHub Actions run artifacts.
          secure: true
